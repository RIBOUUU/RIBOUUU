const wireMat = new THREE.MeshStandardMaterial({ color: 0x55555e, metalness: 0.8, roughness: 0.4 });

const items = [];          // { i, mech, update(t, glow) }
const tiles = [];

    let h = Math.min(5, Math.max(1.0, reach / Math.sin(0.7))); if (reach > 0.93 * h) h = reach / 0.93;
    Object.assign(it, { topple: true, th, h, thc: Math.asin(clamp(reach / h, 0.02, 0.97)) });

    const body = mech === 'domino' ? new THREE.Mesh(new THREE.BoxGeometry(th, h, 1.2), mat) : new THREE.Mesh(new THREE.CylinderGeometry(th / 2, th / 2, h, 28), mat);
    body.position.set(-th / 2, h / 2, 0); body.castShadow = true; body.receiveShadow = true; tilt.add(body);
    const rim = new THREE.Mesh(mech === 'domino' ? new THREE.BoxGeometry(th * 1.05, 0.05, 1.22) : new THREE.CylinderGeometry(th / 2 * 1.04, th / 2 * 1.04, 0.08, 28), glowMat(neon));
    rim.position.set(-th / 2, h - 0.03, 0); tilt.add(rim);
    if (mech === 'cylindre') { const band = new THREE.Mesh(new THREE.CylinderGeometry(th / 2 * 1.02, th / 2 * 1.02, 0.12, 28), glowMat(neon)); band.position.set(-th / 2, h * 0.5, 0); tilt.add(band); it.band = band; }
    it.tilt = tilt; it.rim = rim;
    it.update = (t, glow) => { rim.material.opacity = 0.2 + 0.8 * glow; if (it.band) it.band.material.opacity = 0.9 * glow; };
  } else if (mech === 'boule') {

    const mat = new THREE.MeshStandardMaterial({ color: 0xe2336b, roughness: 0.15, metalness: 0.1, emissive: new THREE.Color(neon), emissiveIntensity: 0 });

    const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.09, L - 0.5, 0.06), brass); shaft.position.y = -0.46 - (L - 0.5) / 2; swing.add(shaft);
    for (let k = 0; k < 3; k++) { const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.14 + 0.05 * (k % 2), 0.1, 0.06), brass); tooth.position.set(0.1, -L + 0.12 + k * 0.16, 0); swing.add(tooth); }

    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 30, 5), wireMat); w.position.y = 15; pivot.add(w);

      const te = tH(i) + 0.08 + E * j / SAND_M, tau = t - te, id = ci * SAND_M + j;
      if (tau < 0 || tau > T) { sandMesh.setMatrixAt(id, ZERO); continue; }
      const k = tau / T, s = s0 + (s1 - s0) * k + (hash(id) - 0.5) * 0.1;
      const p = onPath(s, 0, (hash(id + 7) - 0.5) * 0.18);
      p.y = y0 + vy * tau - g * tau * tau / 2 + (hash(id + 3) - 0.5) * 0.06;
      M4.makeTranslation(p.x, p.y, p.z); sandMesh.setMatrixAt(id, M4);
    }
  });
  sandMesh.instanceMatrix.needsUpdate = true;
}

const waveLight = new THREE.PointLight(0xffffff, 8, 6, 1.6); scene.add(waveLight);
function wavePos(t) {
  const i = Math.min(N - 2, Math.max(0, hopIndex(t))), k = clamp((t - HITS[i].t) / (HITS[i + 1].t - HITS[i].t), 0, 1);
  return onPath(S[i] + (S[i + 1] - S[i]) * k, 1.2);
}
function smoothWave(t, win = 0.45, n = 13) {
  const v = new THREE.Vector3();
  for (let k = 0; k < n; k++) v.add(wavePos(t + (k / (n - 1) - 0.5) * 2 * win));
  return v.divideScalar(n);
}

// ---------- camera : un plan different tous les 10 notes (sans vue a la premiere personne) ----------
const SHOTS = ['suivi', 'plongee', 'contre-plongee', 'balayage', 'penche'];
function updateCamera(t) {
  const iSeg = hopIndex(t), k = segOf(iSeg), shot = SHOTS[k % SHOTS.length];
  const u = Math.max(0, t - segStartT(iSeg));
  const sb = smoothWave(t), look = smoothWave(t + 0.25, 0.35, 9);
  const a = Math.atan2(sb.z, sb.x);
  const rad = new THREE.Vector3(Math.cos(a), 0, Math.sin(a)), fwd = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));
  const at = (base, r, f, y) => base.clone().addScaledVector(rad, r).addScaledVector(fwd, f).addScaledVector(UP, y);
  camera.up.set(0, 1, 0);
  let pos, target, roll = 0, fov = 52;
  if (shot === 'suivi') {
    const phi = a + 0.55 + 0.15 * Math.sin(t * WQ(0.35));
    const rc = 13 + Math.sin(t * WQ(0.42) + 0.6), hc = 5.8 + Math.sin(t * WQ(0.31) + 1.2);
    pos = new THREE.Vector3(rc * Math.cos(phi), sb.y + hc, rc * Math.sin(phi));
    target = new THREE.Vector3(look.x * 0.85, look.y - 1.0, look.z * 0.85);
  } else if (shot === 'plongee') {
    pos = at(sb, 6.5, -2, 8.0 - u * 0.5); target = at(look, 0, 0.8, -0.6); roll = u * 0.6;
  } else if (shot === 'contre-plongee') {
    pos = at(sb, 5.5 - u * 0.3, 3.0, -0.5); target = at(look, 0, -0.5, 0.6); roll = -0.15; fov = 58;
  } else if (shot === 'balayage') {
    const th = 1.3 * Math.sin(u * 1.7);
    pos = at(sb, 7 * Math.cos(th), 7 * Math.sin(th), 2.4 + 1.1 * Math.sin(u * 1.1)); target = at(look, 0, 0, -0.5);
  } else {
    pos = at(sb, 7.5, -1.5 + u * 1.1, 1.0); target = at(look, 0, 0, -0.5); roll = 0.4 * (k % 2 ? 1 : -1); fov = 48;
  }
  fov -= 8 * Math.exp(-u / 0.18);
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.position.copy(pos); camera.lookAt(target); if (roll) camera.rotateZ(roll);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.55, 0.82));
composer.addPass(new OutputPass());

function renderAt(t) {
  topple(t);
  for (const it of items) { const dt = t - tH(it.i); it.update(t, dt >= 0 ? Math.exp(-dt / 0.6) : 0); }
  for (const tl of tiles) { const dt = t - tH(tl.i), g = dt >= 0 ? Math.exp(-dt / 0.6) : 0; tl.m.opacity = Math.min(1, g * 1.4); tl.m.color.setScalar(1 + 2.2 * g); }
  updateSand(t);
  const w = wavePos(t), i = hopIndex(t);
  waveLight.position.copy(w).addScaledVector(UP, 0.8); waveLight.color.set(NEON[mechOf(i)]);
  updateCamera(t);
  const aB = Math.atan2(w.z, w.x);
  sun.position.copy(w).add(SUN_OFF.clone().applyAxisAngle(UP, -aB)); sun.target.position.copy(w);
  sky.position.copy(camera.position); sky.rotation.y = -aB;
  composer.render();
}
window.renderAt = t => { renderAt(t); return renderer.domElement.toDataURL('image/jpeg', 0.93); };
window.END = TL.end;
window.OFF = TL.offset || 0;
window.READY = true;
if (!params.has('capture')) { const st = performance.now(); (function loop(){ renderAt(window.OFF + ((performance.now()-st)/1000) % TL.end); requestAnimationFrame(loop); })(); }
</script></body></html>
