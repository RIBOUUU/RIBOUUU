<!doctype html>
<html><head><meta charset="utf-8"><title>Bonhomme neon</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<script>
// Petit bonhomme en NEON : silhouette epaisse dont on ne dessine que le CONTOUR (tube lumineux),
// coeur blanc + halo bleu. Squelette articule (poses interpolees) pour pouvoir l'animer.
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920);
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.appendChild(cv);
const ctx = cv.getContext('2d');
const S = W / 1080;                                   // echelle
const COL = P.get('c') || '#3b5bff';                  // couleur du neon
// silhouette = traits tres epais (membres) ; on garde seulement le bord : trait large - trait plus fin
const LIMB = 96 * S, TUBE = 11 * S;
// longueurs des os (px a 1080 de large)
const L = { torse: 250, cou: 50, bras: 170, avbras: 150, cuisse: 220, tibia: 200, tete: 78 };
// pose = angle de chaque os a l'ecran (0 = vers le bas, +pi/2 = vers la droite, -pi/2 = vers la gauche, pi = vers le haut)
const POSES = {
  debout: { torse: Math.PI, brasG: -0.25, avG: -0.1, brasD: 0.25, avD: 0.1, cuisseG: -0.12, tibiaG: -0.05, cuisseD: 0.12, tibiaD: 0.05, tete: 0 },
  salut:  { torse: Math.PI + 0.06, brasG: -2.45, avG: -3.0, brasD: 1.15, avD: 0.25, cuisseG: -0.12, tibiaG: -0.08, cuisseD: 0.45, tibiaD: 1.9, tete: 0.08 },   // comme la reference
  danse1: { torse: Math.PI - 0.1, brasG: -2.55, avG: -2.95, brasD: 2.55, avD: 2.95, cuisseG: -0.35, tibiaG: -0.2, cuisseD: 0.35, tibiaD: 0.2, tete: -0.12 },
  danse2: { torse: Math.PI + 0.12, brasG: -1.25, avG: -0.35, brasD: 1.25, avD: 0.35, cuisseG: -0.1, tibiaG: -0.05, cuisseD: 0.75, tibiaD: 1.7, tete: 0.15 },
  saut:   { torse: Math.PI, brasG: -2.2, avG: -2.35, brasD: 2.2, avD: 2.35, cuisseG: -0.6, tibiaG: -0.6, cuisseD: 0.6, tibiaD: 0.6, tete: 0 },
};
const mirror = p => ({ torse: 2 * Math.PI - p.torse, brasG: -p.brasD, avG: -p.avD, brasD: -p.brasG, avD: -p.avG, cuisseG: -p.cuisseD, tibiaG: -p.tibiaD, cuisseD: -p.cuisseG, tibiaD: -p.tibiaG, tete: -p.tete, queue: p.queue || 0 });
const lerpPose = (a, b, u) => { const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * u; return o; };
const ease = u => u * u * (3 - 2 * u);
const dir = a => [Math.sin(a), Math.cos(a)];          // 0 = vers le bas (y ecran vers le bas)
function skeleton(p, hx, hy, femme = false) {                         // membres = COURBES (aucun angle) : debut -> articulation -> fin
  const crv = []; const pt = (x, y, a, l) => { const [dx, dy] = dir(a); return [x + dx * l * S, y + dy * l * S]; };
  const limb = (x, y, a1, l1, a2, l2) => { const j = pt(x, y, a1, l1), e = pt(j[0], j[1], a2, l2);
    // point de controle tel que la courbe passe par l'articulation -> arrondi doux
    crv.push([x, y, 2 * j[0] - (x + e[0]) / 2, 2 * j[1] - (y + e[1]) / 2, e[0], e[1]]); return e; };
  const sh = pt(hx, hy, p.torse, L.torse);
  const mid = pt(hx, hy, p.torse + 0.5 * p.tete, L.torse * 0.5);        // le dos se courbe un peu avec la tete
  crv.push([hx, hy, 2 * mid[0] - (hx + sh[0]) / 2, 2 * mid[1] - (hy + sh[1]) / 2, sh[0], sh[1]]);
  limb(sh[0], sh[1], p.brasG, L.bras, p.avG, L.avbras); limb(sh[0], sh[1], p.brasD, L.bras, p.avD, L.avbras);
  limb(hx, hy, p.cuisseG, L.cuisse, p.tibiaG, L.tibia); limb(hx, hy, p.cuisseD, L.cuisse, p.tibiaD, L.tibia);
  const [hdx, hdy] = dir(p.torse + p.tete); const head = [sh[0] + hdx * (L.tete + 58) * S, sh[1] + hdy * (L.tete + 58) * S];   // tete detachee (petit espace)
  let skirt = null, tail = null;
  if (femme) {                                         // robe trapeze (arrondie) + queue de cheval qui ondule
    const dn = p.torse + Math.PI, [dx, dy] = dir(dn), nx = -dy, ny = dx, top = pt(hx, hy, p.torse, 45), bot = pt(hx, hy, dn, 200);
    skirt = [[top[0] - nx * 40 * S, top[1] - ny * 40 * S], [top[0] + nx * 40 * S, top[1] + ny * 40 * S], [bot[0] + nx * 155 * S, bot[1] + ny * 155 * S], [bot[0] - nx * 155 * S, bot[1] - ny * 155 * S]];
    const back = p.torse + p.tete + 1.0, a0 = pt(head[0], head[1], back, L.tete * 1.15), mid = pt(a0[0], a0[1], back + 0.9 + 0.5 * (p.queue || 0), 85), e = pt(mid[0], mid[1], back + 2.0 + 0.9 * (p.queue || 0), 95);
    tail = [a0[0], a0[1], mid[0], mid[1], e[0], e[1]];
  }
  return { crv, head, skirt, tail };
}
// trace le CONTOUR de la silhouette dans un calque (trait epais en couleur, puis on « vide » l'interieur)
const lay = document.createElement('canvas'); lay.width = W; lay.height = H; const lc = lay.getContext('2d');
function outline(sk, width) {
  lc.clearRect(0, 0, W, H); lc.lineCap = lc.lineJoin = 'round';
  const pass = (w, mode) => { lc.globalCompositeOperation = mode; lc.strokeStyle = '#fff'; lc.fillStyle = '#fff'; lc.lineWidth = w;
    lc.beginPath(); for (const [x1, y1, cx, cy, x2, y2] of sk.crv) { lc.moveTo(x1, y1); lc.quadraticCurveTo(cx, cy, x2, y2); } lc.stroke();
    if (sk.skirt) { lc.lineWidth = w - LIMB + 40 * S; lc.beginPath(); sk.skirt.forEach(([x, y], i) => i ? lc.lineTo(x, y) : lc.moveTo(x, y)); lc.closePath(); lc.fill(); lc.stroke(); }
    if (sk.tail) { lc.lineWidth = w - LIMB + 44 * S; lc.beginPath(); lc.moveTo(sk.tail[0], sk.tail[1]); lc.quadraticCurveTo(sk.tail[2], sk.tail[3], sk.tail[4], sk.tail[5]); lc.stroke(); }
  };
  pass(LIMB + width, 'source-over');                 // silhouette un peu plus grosse
  pass(LIMB - width, 'destination-out');             // moins la silhouette un peu plus fine = le tube
  // tete : anneau separe (le cou reste ouvert comme sur un vrai neon)
  lc.globalCompositeOperation = 'source-over'; lc.lineWidth = width; lc.beginPath(); lc.arc(sk.head[0], sk.head[1], L.tete * S, 0, 7); lc.stroke();
  lc.globalCompositeOperation = 'destination-out'; lc.beginPath(); lc.arc(sk.head[0], sk.head[1], L.tete * S - width / 2, 0, 7); lc.fill();
  lc.globalCompositeOperation = 'source-over';
}
function clearBg() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
function drawNeon(sk, flicker = 1, COL = '#3b5bff', CORE2 = '#8fa8ff') {
  outline(sk, TUBE);
  ctx.globalCompositeOperation = 'lighter';
  for (const [blur, alpha, col] of [[70, 0.7, COL], [32, 0.9, COL], [14, 1.0, COL], [5, 1.0, CORE2]]) {   // halo bleu en couches
    ctx.filter = `blur(${blur * S}px)`; ctx.globalAlpha = alpha * flicker;
    tint(col); ctx.drawImage(tintC, 0, 0);
  }
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  outline(sk, TUBE * 0.45); tint(COL === '#3b5bff' ? '#f4f7ff' : '#fff2f8'); ctx.drawImage(tintC, 0, 0);       // coeur blanc du tube
  ctx.globalCompositeOperation = 'source-over';
}
const tintC = document.createElement('canvas'); tintC.width = W; tintC.height = H; const tc = tintC.getContext('2d');
function tint(col) { tc.globalCompositeOperation = 'source-over'; tc.clearRect(0, 0, W, H); tc.drawImage(lay, 0, 0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = col; tc.fillRect(0, 0, W, H); }

// ---------- petite animation de demo (4 s) : salut, danse, saut ----------
const KEYS = [[0, 'salut'], [0.8, 'salut'], [1.2, 'danse1'], [1.6, 'danse2'], [2.0, 'danse1'], [2.4, 'danse2'], [2.9, 'saut'], [3.4, 'debout'], [4.0, 'salut']];
function poseAt(t) {                                   // Catmull-Rom : pas d'a-coup entre les poses
  const n = KEYS.length - 1; let q = 0; while (q < n - 1 && t > KEYS[q + 1][0]) q++;
  const u = Math.min(1, Math.max(0, (t - KEYS[q][0]) / (KEYS[q + 1][0] - KEYS[q][0])));
  const g = i => POSES[KEYS[Math.min(n, Math.max(0, i))][1]], P0 = g(q - 1), P1 = g(q), P2 = g(q + 1), P3 = g(q + 2), o = {};
  for (const k in P1) o[k] = 0.5 * (2 * P1[k] + (-P0[k] + P2[k]) * u + (2 * P0[k] - 5 * P1[k] + 4 * P2[k] - P3[k]) * u * u + (-P0[k] + 3 * P1[k] - 3 * P2[k] + P3[k]) * u * u * u);
  const w = Math.sin(t * Math.PI * 2 / 0.8);             // ondulation souple permanente (bras et dos)
  o.avG += 0.18 * w; o.avD -= 0.18 * w; o.tete += 0.06 * Math.sin(t * Math.PI * 2 / 1.6); o.torse += 0.04 * w;
  return o;
}
const MODE = P.get('qui') || 'lui';                   // lui | elle | duo
function drawAt(t) {
  const p = P.has('pose') ? { ...POSES[P.get('pose')] } : poseAt(t % 4);
  p.queue = 0.35 * Math.sin(t * Math.PI * 2 / 0.9);    // la queue de cheval suit le mouvement
  const jump = !P.has('pose') && t % 4 > 2.6 && t % 4 < 3.3 ? Math.sin((t % 4 - 2.6) / 0.7 * Math.PI) * 180 * S : 0;
  const bob = Math.abs(Math.sin(t * Math.PI / 0.4)) * 14 * S * (t % 4 > 1.1 && t % 4 < 2.6);
  const fl = 0.94 + 0.06 * Math.sin(t * 37) * Math.sin(t * 13);
  clearBg();
  if (MODE === 'lui') drawNeon(skeleton(p, W / 2, H * 0.55 - jump - bob), fl);
  if (MODE === 'elle') drawNeon(skeleton(mirror(p), W / 2, H * 0.55 - jump - bob, true), fl, '#ff2f9a', '#ff9ccf');
  if (MODE === 'duo') {                                // lui a gauche (bleu), elle a droite (rose), face a face
    const sc = 0.68; ctx.save(); ctx.translate(W * 0.25, H * 0.55); ctx.scale(sc, sc); ctx.translate(-W / 2, -H * 0.55);
    drawNeon(skeleton(p, W / 2, H * 0.55 - jump - bob), fl); ctx.restore();
    ctx.save(); ctx.translate(W * 0.77, H * 0.55); ctx.scale(sc, sc); ctx.translate(-W / 2, -H * 0.55);
    drawNeon(skeleton(mirror(p), W / 2, H * 0.55 - jump - bob, true), fl, '#ff2f9a', '#ff9ccf'); ctx.restore();
  }
}
window.renderAt = t => { drawAt(t); return cv.toDataURL('image/jpeg', 0.94); };
window.END = 4; window.READY = true;
if (!P.has('capture')) { const st = performance.now(); (function loop() { drawAt((performance.now() - st) / 1000); requestAnimationFrame(loop); })(); }
</script></body></html>
