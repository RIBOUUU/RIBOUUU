<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1080), H = +(params.get('h') || 1920);
const TL = await (await fetch('timeline.json')).json();
// Mode boucle : on prolonge la spirale avant et apres (copies periodiques des notes),
// pour que la derniere image s'enchaine exactement sur la premiere.
const LOOP = !!TL.loop, N0 = TL.hits.length, KX = LOOP ? 20 : 0;
const HITS = [];
for (let j = -KX; j < N0 + KX; j++) {
  const m = ((j % N0) + N0) % N0, rep = Math.floor(j / N0);
  HITS.push({ ...TL.hits[m], t: TL.hits[m].t + rep * TL.end });
}
const N = HITS.length;
// en boucle, chaque oscillation fait un nombre entier de tours sur la duree de la boucle
const WQ = w => LOOP ? Math.max(1, Math.round(w * TL.end / (2 * Math.PI))) * 2 * Math.PI / TL.end : w;
const IDX = j => LOOP ? (((j - KX) % N0) + N0) % N0 : j;   // indice de la note dans le morceau

// =====================================================================
// PRINCIPE : la bille avance TOUJOURS a la meme vitesse le long de la
// spirale (V). Ce sont les blocs qui se rapprochent quand la musique
// accelere : l'ecart entre deux blocs = V x duree de la note.
// Tous les 10 notes : nouveau type de bloc + nouvelle facon de tomber.
// =====================================================================
const R = 5.0;          // rayon de la trajectoire
const V = 5.5;          // vitesse constante de la bille le long de la spirale (unites/s)
const BR = 0.28;        // rayon de la bille
const SEG = 10;         // nombre de notes par segment de style
const APEX_MAX = 2.2;   // hauteur max d'un saut (au-dela, le bloc suivant est place plus bas)
const onSpiral = (a, y, r = R) => new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a));

// --- types de blocs (changent tous les 10 notes) ---
const BLOCK_STYLES = [
  { name: 'onyx',    shape: 'box', L: 2.5, H: 0.85, maxW: 0.9,  off: 0.35, color: 0x18181c, rough: 0.55, metal: 0.2, neon: '#ffd21a' },
  { name: 'verre',   shape: 'box', L: 2.3, H: 0.7,  maxW: 0.85, off: 0.3,  color: 0x9fd6ff, rough: 0.1,  metal: 0.0, neon: '#8fd0ff', glass: true },
  { name: 'bois',    shape: 'box', L: 2.9, H: 0.32, maxW: 0.8,  off: 0.4,  color: 0x7a4a26, rough: 0.7,  metal: 0.0, neon: '#ff8a2a' },
  { name: 'cube',    shape: 'box', L: 1.05,H: 1.05, maxW: 1.05, off: 0.0,  color: 0x2a0c16, rough: 0.4,  metal: 0.3, neon: '#ff3d8b' },
  { name: 'tambour', shape: 'hex', L: 1.2, H: 0.7,  maxW: 1.2,  off: 0.0,  color: 0x22123a, rough: 0.45, metal: 0.3, neon: '#b56cff' },
  { name: 'or',      shape: 'box', L: 2.5, H: 0.55, maxW: 0.9,  off: 0.35, color: 0xc9a227, rough: 0.28, metal: 1.0, neon: '#3dff8a' },
];
// --- facons de tomber (changent tous les 10 notes) ---
//  g : gravite, slope : descente par seconde de trajet, zig : ecart radial alterne, squash : ecrasement
const FALL_STYLES = [
  { name: 'rebond',      g: 39, slope: 1.3 },
  { name: 'rase-mottes', g: 39, slope: 3.6 },
  { name: 'grand saut',  g: 75, slope: 1.3 },
  { name: 'zigzag',      g: 39, slope: 1.3, zig: 0.6 },
  { name: 'ecrase',      g: 39, slope: 1.3, squash: true },
];
const segOf = i => Math.floor(IDX(i) / SEG);
const segStartT = i => HITS[Math.max(0, i - (IDX(i) % SEG))].t;   // instant de la 1re note du segment
const blockStyle = i => BLOCK_STYLES[segOf(i) % BLOCK_STYLES.length];
const fallStyle = i => FALL_STYLES[segOf(i) % FALL_STYLES.length];

// --- placement des impacts + parametres de chaque saut ---
const land = [];   // {a, y, r} point de contact (centre de la bille)
const hops = [];   // {T, g, vy}
land.push({ a: 0, y: 0, r: R });
for (let i = 0; i < N; i++) {
  // derniere note : la bille saute directement sur le rail de sortie (elle n'attend pas la fin du son)
  const T = !LOOP && i === N - 1 ? 0.45 : HITS[i].dur, fs = fallStyle(i);
  let dy = -fs.slope * T;
  let vy = (dy + fs.g * T * T / 2) / T;
  const vmax = Math.sqrt(2 * fs.g * APEX_MAX);
  if (vy > vmax) { vy = vmax; dy = vy * T - fs.g * T * T / 2; }   // note longue : chute plus profonde
  const nextZig = i + 1 < N ? fallStyle(i + 1).zig || 0 : 0;
  const r = R + (nextZig ? ((IDX(i + 1)) % 2 ? nextZig : -nextZig) : 0);
  hops.push({ T, g: fs.g, vy });
  const p = land[i];
  land.push({ a: p.a - V * T / R, y: p.y + dy, r });
}
// land[N] = arrivee sur le rail de sortie

// ---------- embranchements (suspense) ----------
// A chaque fourche, le chemin se divise en 3 pistes ; la bille n'en prend qu'une,
// les deux autres s'arretent dans le vide.
const LANES = [ { dr: -1.5, dy: 0.0 }, { dr: 0.0, dy: -1.7 }, { dr: 1.5, dy: -3.4 } ];
const FORK_LEN = 6;                                    // nb de notes pendant lesquelles les pistes coexistent
const FORKS = [];   // embranchements desactives (ex. : [{ at: 6, choice: 2 }, { at: 22, choice: 0 }])
const baseLand = land.map(l => ({ ...l }));
const decoys = [];                                     // {i, p} blocs leurres
{
  let cumDy = 0;
  const offDr = new Array(N + 1).fill(0), offDy = new Array(N + 1).fill(0);
  let fk = 0;
  for (let n = 0; n <= N; n++) {
    const f = FORKS[fk];
    if (f && n > f.at && n <= f.at + FORK_LEN) {
      const ramp = Math.min(1, (n - f.at) / 2), L = LANES[f.choice];
      offDr[n] = L.dr * ramp; offDy[n] = cumDy + L.dy * ramp;
      LANES.forEach((Lj, j) => { if (j !== f.choice) decoys.push({ i: n, p: { a: baseLand[n].a, y: baseLand[n].y + cumDy + Lj.dy * ramp, r: baseLand[n].r + Lj.dr * ramp } }); });
      if (n === f.at + FORK_LEN) { cumDy += L.dy; f.back = L.dr; fk++; }
    } else {
      const prev = FORKS[fk - 1];
      const k = prev ? n - (prev.at + FORK_LEN) : 99;
      offDr[n] = prev && k <= 3 ? prev.back * (1 - k / 3) : 0;
      offDy[n] = cumDy;
    }
    land[n].r += offDr[n]; land[n].y += offDy[n];
  }
  // la physique reste exacte : on recalcule la vitesse verticale de chaque saut
  for (let i = 0; i < N; i++) {
    const h = hops[i], dy = land[i + 1].y - land[i].y;
    h.vy = (dy + h.g * h.T * h.T / 2) / h.T;
  }
}
const inFork = i => FORKS.find(f => i >= f.at - 1 && i <= f.at + 2);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9b4d4, 13, 46);
const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 200);

const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){
    float warm = smoothstep(-0.6, 1.0, dot(normalize(vP.xz+1e-4), normalize(vec2(1.,-.4))));
    vec3 cool = vec3(.55,.60,.78), hot = vec3(.98,.76,.68);
    vec3 c = mix(cool, hot, warm*0.85);
    c = mix(c, vec3(.88,.87,.95), smoothstep(0.1, 0.9, vP.y));
    c = mix(c, vec3(.42,.42,.58), smoothstep(-0.1, -0.9, vP.y));
    gl_FragColor = vec4(c,1.); }`
}));
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xd6d6ff, 0x5a5070, 0.9));
const sun = new THREE.DirectionalLight(0xffc4a2, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 0.5, far: 45 });
sun.shadow.bias = -0.0004; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(10, 14, -6);

const yMin = Math.min(...land.map(l => l.y));
const column = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, -yMin + 80, 64),
  new THREE.MeshStandardMaterial({ color: 0xe9e6f2, roughness: 0.9 }));
column.position.y = (40 + yMin - 40) / 2; column.receiveShadow = true; scene.add(column);

// ---------- textures 7 segments (par couleur de neon) ----------
const SEGS = { 0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcfgd' };
function segPaths(ctx, s, x0, y0, w, h, t) {
  const m = { a:[x0+t,y0,w-2*t,t], d:[x0+t,y0+h-t,w-2*t,t], g:[x0+t,y0+h/2-t/2,w-2*t,t],
    f:[x0,y0+t,t,h/2-t*1.5], b:[x0+w-t,y0+t,t,h/2-t*1.5], e:[x0,y0+h/2+t/2,t,h/2-t*1.5], c:[x0+w-t,y0+h/2+t/2,t,h/2-t*1.5] };
  for (const k of s) { const [x,y,ww,hh] = m[k]; ctx.beginPath(); ctx.roundRect(x,y,ww,hh,t*0.45); ctx.fill(); }
}
const texCache = {};
function digitTex(d, neon) {   // neon = null -> face eteinte
  const key = d + (neon || 'off');
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  if (neon) {
    g.strokeStyle = neon; g.lineWidth = 16; g.strokeRect(8, 8, 240, 240);
    g.fillStyle = neon; segPaths(g, SEGS[d], 70, 42, 116, 172, 22);
  } else {
    g.fillStyle = '#151518'; g.fillRect(0, 0, 256, 256);
    g.fillStyle = '#26262c'; segPaths(g, SEGS[8], 70, 42, 116, 172, 22);
    g.fillStyle = '#34343c'; segPaths(g, SEGS[d], 70, 42, 116, 172, 22);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return (texCache[key] = t);
}

// ---------- blocs ----------
const screwGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.03, 16);
const screwMat = new THREE.MeshStandardMaterial({ color: 0xb8b8c0, metalness: 1, roughness: 0.3 });
const wireMat = new THREE.MeshStandardMaterial({ color: 0x55555e, metalness: 0.8, roughness: 0.4 });
const styleMats = BLOCK_STYLES.map(s => new THREE.MeshStandardMaterial({
  color: s.color, roughness: s.rough, metalness: s.metal,
  transparent: !!s.glass, opacity: s.glass ? 0.55 : 1, emissive: s.glass ? 0x203850 : 0x000000 }));
const blocks = [];
function addBlock(i, p, hitT) {
  const st = blockStyle(i), mat = styleMats[BLOCK_STYLES.indexOf(st)];
  // largeur : limitee par l'ecart avec les voisins (les blocs se serrent quand ca accelere)
  const gap = Math.min(i > 0 ? land[i - 1].a - p.a : 9, p.a - land[i + 1].a);
  const rIn = p.r + st.off - st.L / 2;
  const w = Math.min(st.maxW, Math.abs(gap) * Math.max(rIn, 1.5) * 0.78);
  const grp = new THREE.Group();
  grp.position.copy(onSpiral(p.a, p.y - BR - st.H / 2, p.r + st.off));
  grp.rotation.y = -p.a;
  let body, faceW, faceX;
  if (st.shape === 'hex') {
    const rad = Math.min(st.L / 2, w / 2 / Math.cos(Math.PI / 6));
    body = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, st.H, 6), mat);
    body.rotation.y = Math.PI / 6;               // une face plate vers l'exterieur (+x)
    faceW = rad * 0.92; faceX = rad * Math.cos(Math.PI / 6);
  } else {
    body = new THREE.Mesh(new THREE.BoxGeometry(st.L, st.H, w), mat);
    faceW = w * 0.96; faceX = st.L / 2;
  }
  body.castShadow = true; body.receiveShadow = !st.glass; grp.add(body);
  if (st.shape === 'box' && st.L > 2) for (const sx of [-st.L * 0.34, st.L * 0.3]) {
    const s = new THREE.Mesh(screwGeo, screwMat); s.position.set(sx, st.H / 2 + 0.01, 0); grp.add(s);
  }
  const faceH = Math.min(st.H * 0.96, faceW * 1.1), faceGeo = new THREE.PlaneGeometry(faceW, faceH);
  const d = (IDX(i) + 1) % 10;
  const off = new THREE.Mesh(faceGeo, new THREE.MeshBasicMaterial({ map: digitTex(d, null) }));
  off.position.x = faceX + 0.003; off.rotation.y = Math.PI / 2; grp.add(off);
  const onMat = new THREE.MeshBasicMaterial({ map: digitTex(d, st.neon), transparent: true, opacity: 0, toneMapped: false,
    blending: THREE.AdditiveBlending, depthWrite: false });
  const on = new THREE.Mesh(faceGeo, onMat); on.position.x = faceX + 0.006; on.rotation.y = Math.PI / 2; grp.add(on);
  // liseré neon sur le dessus (visible quand le bloc est touche)
  const rimMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(st.neon), transparent: true, opacity: 0, toneMapped: false,
    blending: THREE.AdditiveBlending, depthWrite: false });
  const rim = new THREE.Mesh(new THREE.PlaneGeometry(st.shape === 'hex' ? faceW * 1.6 : st.L * 0.96, st.shape === 'hex' ? faceW * 1.6 : w * 0.9), rimMat);
  rim.rotation.x = -Math.PI / 2; rim.position.y = st.H / 2 + 0.004; grp.add(rim);
  if (IDX(i) % 3 === 0 && isFinite(hitT)) {
    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 30, 6), wireMat);
    wire.position.set(faceX - 0.15, st.H / 2 + 15, 0); grp.add(wire);
  }
  scene.add(grp);
  blocks.push({ grp, onMat, rimMat, baseY: grp.position.y, hit: hitT });
}
for (let i = 0; i < N; i++) addBlock(i, land[i], HITS[i].t);
for (const d of decoys) addBlock(d.i, d.p, Infinity);

// ---------- rail de sortie ----------
const railMat = new THREE.MeshStandardMaterial({ color: 0x9a9aa6, metalness: 0.9, roughness: 0.25 });
const railGroup = new THREE.Group(); railGroup.visible = !LOOP; scene.add(railGroup);
const RAIL_LIFT = 0.07 + BR;
const E = land[N];
const outPts = [0, 1.5, 3.2, 5.5, 8.5].map((k, j) => onSpiral(E.a - k / R * 1.6, E.y - RAIL_LIFT - j * 0.45, R));
const outCurve = new THREE.CatmullRomCurve3(outPts);
for (const dr of [-0.17, 0.17]) {
  const p = outPts.map(v => { const r = Math.hypot(v.x, v.z), a = Math.atan2(v.z, v.x); return onSpiral(a, v.y, r + dr); });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p), 200, 0.025, 8), railMat);
  tube.castShadow = true; railGroup.add(tube);
}
for (let u = 0.04, j = 0; u < 1; u += 0.08, j++) {
  const v = outCurve.getPoint(u), a = Math.atan2(v.z, v.x);
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4, 6), railMat);
  t.position.set(v.x, v.y - 0.06, v.z); t.rotation.z = Math.PI / 2; t.rotation.y = -a; railGroup.add(t);
  if (j % 3 === 1) { const h = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 30, 4), wireMat); h.position.set(v.x, v.y + 15, v.z); railGroup.add(h); }
}

// ---------- bille ----------
function planetTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, 512, 256);   // texture neutre, teintee par la couleur de la bille
  let s = 3; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 70; k++) {
    g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.6)' : 'rgba(90,90,90,0.5)';
    g.beginPath(); g.ellipse(rnd()*512, rnd()*256, 10+rnd()*45, 6+rnd()*22, rnd()*3, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const pt = planetTex();
const ballPivot = new THREE.Group(); scene.add(ballPivot);
const ball = new THREE.Mesh(new THREE.SphereGeometry(BR, 48, 32),
  new THREE.MeshStandardMaterial({ map: pt, emissiveMap: pt, emissive: 0xffffff, emissiveIntensity: 1.25, roughness: 0.25 }));
ball.castShadow = true; ballPivot.add(ball);
const halo = new THREE.Mesh(new THREE.SphereGeometry(BR * 1.25, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0x7ffff0, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
ball.add(halo);
const ballLight = new THREE.PointLight(0x5cffd8, 6, 5, 1.6); ballPivot.add(ballLight);
// couleur de la bille : change tous les 10 notes (avec un flash)
const BALL_COLORS = ['#3fe0d0', '#ff4fa3', '#ffb02e', '#8f6bff', '#7dff5a', '#ff5a3c'].map(c => new THREE.Color(c));
function updateBallColor(t) {
  const i = t < HITS[0].t ? 0 : hopIndex(t), k = segOf(i);
  const tCut = segStartT(i), u = t - tCut;
  const cur = BALL_COLORS[k % BALL_COLORS.length], prev = BALL_COLORS[(k + BALL_COLORS.length - 1) % BALL_COLORS.length];
  const c = (LOOP || k > 0) && u < 0.15 ? prev.clone().lerp(cur, u / 0.15) : cur.clone();
  const flash = (LOOP || k > 0) ? Math.exp(-Math.max(u, 0) / 0.12) : 0;
  ball.material.color.copy(c);
  ball.material.emissive.copy(c).lerp(new THREE.Color(1, 1, 1), flash * 0.6);
  ball.material.emissiveIntensity = 1.25 + 2.5 * flash;
  halo.material.color.copy(c);
  halo.scale.setScalar(1 + 0.8 * flash);
  ballLight.color.copy(c);
  ballLight.intensity = 6 + 10 * flash;
}

// ---------- trajectoire : physique reelle, vitesse horizontale constante ----------
const P = l => onSpiral(l.a, l.y, l.r);
function hopIndex(t) {
  let lo = 0, hi = N - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (HITS[m].t <= t) lo = m; else hi = m - 1; }
  return lo;
}
function ballPos(t) {
  const t0 = HITS[0].t;
  if (t < t0) { const p = P(land[0]); p.y += 9.0 * (t0 - t) ** 2 + 2.4 * (t0 - t); p.a = land[0].a; return p; }
  const tl = HITS[N - 1].t + hops[N - 1].T;
  if (t >= tl) {                                         // roule sur le rail de sortie, meme vitesse
    const u = Math.min(1, (t - tl) * V / outCurve.getLength());
    return outCurve.getPointAt(u).add(new THREE.Vector3(0, RAIL_LIFT, 0));
  }
  const i = hopIndex(t), h = hops[i], s = t - HITS[i].t, k = Math.min(1, s / h.T);
  const A = land[i], B = land[i + 1];
  const a = A.a + (B.a - A.a) * k, r = A.r + (B.r - A.r) * k;
  return onSpiral(a, A.y + h.vy * s - h.g * s * s / 2, r);
}
function smoothBall(t, win = 0.45, n = 13) {
  const v = new THREE.Vector3();
  for (let k = 0; k < n; k++) v.add(ballPos(t + (k / (n - 1) - 0.5) * 2 * win));
  return v.divideScalar(n);
}

// ---------- post-traitement ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.55, 0.82));
composer.addPass(new OutputPass());

const ease = x => x * x * (3 - 2 * x);
// ---------- camera : un plan different tous les 10 notes (coupe franche) ----------
const UP = new THREE.Vector3(0, 1, 0);
const SHOTS = ['suivi', 'plongee', 'contre-plongee', 'poursuite', 'balayage', 'penche'];
function updateCamera(t) {
  const iSeg = t < HITS[0].t ? 0 : hopIndex(Math.min(t, HITS[N - 1].t));
  const k = segOf(iSeg), shot = SHOTS[k % SHOTS.length];
  const tCut = segStartT(iSeg), u = Math.max(0, t - tCut);   // temps depuis la coupe
  const sb = smoothBall(t), look = smoothBall(t + 0.25, 0.35, 9);
  const a = Math.atan2(sb.z, sb.x);
  const rad = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));          // vers l'exterieur
  const fwd = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));         // sens de la bille
  const at = (base, r, f, y) => base.clone().addScaledVector(rad, r).addScaledVector(fwd, f).addScaledVector(UP, y);
  camera.up.set(0, 1, 0);
  let pos, target, roll = 0, fov = 52;
  const fk = t >= HITS[0].t ? inFork(hopIndex(t)) : null;
  if (fk) {                                           // plan large de suspense : on voit les 3 pistes
    const uf = t - HITS[fk.at - 1].t;
    const ahead = smoothBall(t + 0.55, 0.3, 9);
    const mid = sb.clone().lerp(ahead, 0.3);
    pos = at(mid, 9.5 - uf * 0.6, 1.5, 7.5 - uf * 0.6);
    target = at(mid, 0.3, 0, -1.6);
    fov = 50 - 6 * Math.exp(-uf / 0.18);
  } else if (shot === 'suivi') {
    const intro = LOOP ? 0 : 1 - ease(Math.min(1, Math.max(0, t) / 1.2));
    const phi = a + 0.6 + 0.2 * Math.sin(t * WQ(0.35)) + 0.4 * intro;
    const rc = 15.5 + Math.sin(t * WQ(0.42) + 0.6) + 2.5 * intro, hc = 7.8 + 1.2 * Math.sin(t * WQ(0.31) + 1.2) + 2 * intro;
    pos = new THREE.Vector3(rc * Math.cos(phi), sb.y + hc, rc * Math.sin(phi));
    target = new THREE.Vector3(look.x * 0.8, look.y - 1.6, look.z * 0.8);
  } else if (shot === 'plongee') {                    // vue du dessus qui tourne sur elle-meme
    pos = at(sb, 2.5, -1.5, 12 - u * 0.8);
    target = at(look, 0, 0.5, 0);
    roll = u * 0.9;
  } else if (shot === 'contre-plongee') {             // plan rasant a hauteur de bille, legerement par en dessous
    pos = at(sb, 6.5 - u * 0.3, 3.5, -0.15);
    target = at(look, 0, -0.5, 0.9);
    roll = -0.2; fov = 58;
  } else if (shot === 'poursuite') {                  // camera embarquee juste derriere la bille
    const sc = smoothBall(t, 0.15, 7), lk = smoothBall(t + 0.3, 0.15, 7);
    pos = at(sc, 0.9, -2.8, 1.5);
    target = at(lk, 0, 1.5, -0.4);
    fov = 62; roll = 0.12 * Math.sin(u * 3);
  } else if (shot === 'balayage') {                   // arc rapide autour de la bille
    const th = 1.35 * Math.sin(u * 1.7);
    pos = at(sb, 7.5 * Math.cos(th), 7.5 * Math.sin(th), 2.2 + 1.5 * Math.sin(u * 1.1));
    target = at(look, 0, 0, -0.3);
  } else {                                            // plan penche, face aux chiffres
    pos = at(sb, 8.5, -1.5 + u * 1.2, 0.9);
    target = at(look, 0, 0, -0.5);
    roll = 0.42 * (k % 2 ? 1 : -1);
    fov = 48;
  }
  if (!fk) fov -= 8 * Math.exp(-u / 0.18);                     // petit "punch" de zoom a chaque coupe
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.position.copy(pos);
  camera.lookAt(target);
  if (roll) camera.rotateZ(roll);
}

function renderAt(t) {
  const p = ballPos(t);
  ballPivot.position.copy(p);
  ball.rotation.set(t * WQ(2.1), -t * WQ(3.3), 0);
  halo.material.opacity = 0.10 + 0.04 * Math.sin(t * WQ(9));
  updateBallColor(t);

  // ecrasement a l'impact (style "ecrase")
  ballPivot.scale.set(1, 1, 1);
  if (t >= HITS[0].t && t < HITS[N - 1].t + hops[N - 1].T) {
    const i = hopIndex(t), dt = t - HITS[i].t;
    const prevSquash = i > 0 && fallStyle(i - 1).squash, curSquash = fallStyle(i).squash;
    const toNext = hops[i].T - dt;
    let q = 0;
    if (prevSquash || curSquash) q = Math.max(Math.exp(-dt / 0.05), 0);
    if (curSquash && toNext < 0.05) q = Math.max(q, 1 - toNext / 0.05);
    if (q > 0) { const sy = 1 - 0.38 * q, sx = 1 + 0.25 * q; ballPivot.scale.set(sx, sy, sx); ballPivot.position.y -= BR * (1 - sy); }
  }

  for (const b of blocks) {
    const dt = t - b.hit;
    let glow = 0, dip = 0;
    if (dt >= 0) { glow = Math.exp(-dt / 0.55); dip = -0.07 * Math.exp(-dt / 0.09) * Math.cos(dt * 40); }
    b.onMat.opacity = Math.min(1, glow * 1.4);
    b.onMat.color.setScalar(1 + 2.2 * glow);
    b.rimMat.opacity = 0.18 * Math.exp(-Math.max(dt, 0) / 0.25) * (dt >= 0);
    b.grp.position.y = b.baseY + dip;
  }

  updateCamera(t);
  const aB = Math.atan2(p.z, p.x);
  sun.position.copy(p).add(SUN_OFF.clone().applyAxisAngle(UP, -aB)); sun.target.position.copy(p);
  sky.position.copy(camera.position); sky.rotation.y = -aB;
  composer.render();
}
window.renderAt = t => { renderAt(t); return renderer.domElement.toDataURL('image/jpeg', 0.93); };
window.END = TL.end;
window.READY = true;
if (!params.has('capture')) { const st = performance.now(); (function loop(){ renderAt(((performance.now()-st)/1000) % TL.end); requestAnimationFrame(loop); })(); }
</script></body></html>
