<html><head><meta charset="utf-8"><title>Spirale 10 blocs</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>

</head><body>
<script type="module">
// Spirale EPIQUE refaite en temps reel (Three.js, sans Blender) avec 10 concepts de blocs.
// Chaque bloc special occupe 2 notes : la 1re note = la bille touche le bloc, la 2e = l'evenement du bloc
// (apogee du ressort, decollage du slime, bord de la glace, anneau du booster, poteau du bumper, 2e vitre,
//  sortie du portail, contact de l'aimant, sommet du souffle du ventilo, 3e tic du tic-tac).
// Axe Z vers le haut (comme dans Blender) : camera.up = (0,0,1).
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1080), H = +(params.get('h') || 1920);
const TL = await (await fetch('timeline_epique.json')).json();
const HITS = TL.hits, TUN = TL.tunnels, END = TL.end;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const R = 5.0, V = 5.5, BR = 0.28, SLOPE = 1.3;
const RF = 1.5, R0 = 0.30, HF = 1.7, TUBE = 3.4;
const NEON = [0xff6b00, 0xff1a05, 0xff0a66];
const BALLC = [[0.1, 1.0, 0.75], [0.55, 0.35, 1.0], [1.0, 0.72, 0.08]];
const P = (a, r, z) => V3(r * Math.cos(a), r * Math.sin(a), z);
const sstep = (e0, e1, x) => { const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return u * u * (3 - 2 * u); };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// saut parabolique de hauteur H au-dessus du point de depart (ou du point d'arrivee s'il est plus haut)
function hopH(z0, z1, T, Hh) {
  const dy = z1 - z0; Hh = Math.max(Hh, dy + 0.15);
  const x = (Math.sqrt(2 * Hh) + Math.sqrt(2 * Hh - 2 * dy)) / T; const g = x * x;
  return { g, vy: Math.sqrt(2 * g * Hh) };
}
const hopNat = T => Math.min(2.2, 0.15 + 1.6 * T);
// segment generique : interpolation (a, r) lineaire, z parabolique
function hopSeg(t0, T, A, B, Hh) {
  const { g, vy } = hopH(A.z, B.z, T, Hh);
  return s => ({ p: P(A.a + (B.a - A.a) * s / T, A.r + (B.r - A.r) * s / T, A.z + vy * s - g * s * s / 2) });
}
function fallSeg(T, A, B, v0) {          // chute balistique de A vers B avec vitesse verticale initiale v0
  const g = 2 * (A.z + v0 * T - B.z) / (T * T);
  return s => ({ p: P(A.a + (B.a - A.a) * s / T, A.r + (B.r - A.r) * s / T, A.z + v0 * s - g * s * s / 2) });
}

// ================= les 10 concepts de blocs =================
const TYPES = ['ressort', 'glace', 'booster', 'bumper', 'verre', 'portail', 'aimant', 'ventilo', 'canon'];
// Les blocs d'un meme pouvoir s'enchainent en serie : le spectateur comprend l'effet en le voyant plusieurs fois.
// PLAN[section] = [[premiere note, derniere note, type], ...] (numeros de note dans la section)
const PLAN = { 0: [[1, 6, 'ressort']], 1: [[1, 5, 'booster'], [6, 10, 'portail']], 2: [[1, 6, 'verre'], [7, 12, 'aimant']] };
const SEGS = [], BLOCKS = [], FUN = [], EVENTS = [];
let ga = 0, gr = R, gz = 0, nType = 0;   // position courante (les fermetures utilisent des copies locales)
let i = 0;
while (i < HITS.length) {
  const a = ga, r = gr, z = gz;
  const h = HITS[i], t0 = h.t, s = h.sec, T1 = h.dur;
  const kind = i > 0 && HITS[i - 1].sec !== s ? 'sortie' : 'normal';
  const nextIsRim = i < HITS.length - 1 && HITS[i + 1].sec !== s;
  const last = i === HITS.length - 1;
  const iSec = i - HITS.findIndex(x => x.sec === s);
  const planned = (PLAN[s] || []).find(([d, f_]) => iSec >= d && iSec <= f_);
  const canPair = !nextIsRim && !last && kind === 'normal' && !!planned;
  const A = { a, r, z };
  if (nextIsRim) {                                   // saut dans l'entonnoir
    const tn = TUN[s]; const ac = a - V * T1 / R, zr = z - SLOPE * T1 * 0.6;
    BLOCKS.push({ type: kind, a, r, z, t: t0, sec: s, i, hits: [t0] });
    SEGS.push({ t0, t1: t0 + T1, f: hopSeg(t0, T1, A, { a: ac, r: R, z: zr }, hopNat(T1)) });
    const C = P(ac, R + RF, 0), top = zr - BR, k = HF / (RF / R0 - 1);
    const F = tn.drop - tn.rim, D = tn.exit - tn.drop;
    const arr = []; let th = ac + Math.PI; const n = 900;
    for (let q = 0; q <= n; q++) { const u = q / n, rr = RF * Math.pow(R0 / RF, u * u); arr.push([th, rr]); th += V * (1 + 1.8 * u) / rr * F / n; }
    const z_hole = top - HF + BR, z_e = z_hole - TUBE - 1.1, v0 = 1.5;
    const fn = { C, ac, top, k, arr, F, D, rim: tn.rim, drop: tn.drop, exit: tn.exit, z_hole, z_e, v0,
                 A: 2 * (z_hole - z_e - v0 * D) / (D * D), w_end: V * 2.8 / R0, sec: s };
    FUN.push(fn);
    SEGS.push({ t0: tn.rim, t1: tn.exit, f: s_ => ({ p: funnelPos(fn, tn.rim + s_) }) });
    ga = ac; gr = R + RF; gz = z_e; i += 1; continue;
  }
  if (last) {                                         // final : grand saut sur place
    BLOCKS.push({ type: kind, a, r, z, t: t0, sec: s, i, hits: [t0] });
    SEGS.push({ t0, t1: t0 + T1, f: hopSeg(t0, T1, A, A, 3.0) }); i += 1; continue;
  }
  if (!canPair) {                                     // bloc normal (une note)
    const B = { a: a - V * T1 / R, r: R, z: z - SLOPE * T1 };
    BLOCKS.push({ type: kind, a, r, z, t: t0, sec: s, i, hits: [t0] });
    SEGS.push({ t0, t1: t0 + T1, f: hopSeg(t0, T1, A, B, hopNat(T1)) });
    ga = B.a; gr = B.r; gz = B.z; i += 1; continue;
  }
  // ----- bloc special : UNE note (la bille touche toujours le bloc suivant pile sur la note suivante) -----
  const T = T1, TT = T1;
  const type = planned[2]; nType++;
  const K = clamp((T - 0.24) / 0.3, 0, 1);           // notes rapides -> effet plus compact
  const blk = { type, a, r, z, t: t0, sec: s, i, hits: [t0], T1: T, T2: 0 };
  const Bn = { a: a - V * T / R, r: R, z: z - SLOPE * T };
  let B = Bn, f, tm = t0 + T * 0.5;
  if (type === 'ressort') {                          // trampoline : saut beaucoup plus haut
    B = { ...Bn, z: Bn.z - 0.3 }; f = hopSeg(t0, T, A, B, 1.3 + 1.6 * K);
  } else if (type === 'slime') {                     // reste colle 40 % de la note puis se decolle
    const ts = 0.4 * T; tm = t0 + ts; const hp = hopSeg(tm, T - ts, A, B, hopNat(T - ts) + 0.2);
    f = s_ => s_ < ts ? { p: P(a, r, z), sq: 0.35 * Math.exp(-s_ / 0.06) + 0.08 } : hp(s_ - ts);
  } else if (type === 'glace') {                     // glisse 45 % de la note puis tombe du bord
    const ts = 0.45 * T, as = a - V * ts / R; tm = t0 + ts;
    B = { ...Bn, z: Bn.z - 0.3 - 0.5 * K }; const fl = fallSeg(T - ts, { a: as, r: R, z }, B, 0);
    f = s_ => s_ < ts ? { p: P(a - V * s_ / R, R, z) } : fl(s_ - ts); blk.a1 = as;
  } else if (type === 'booster') {                   // vol rasant 1,6 fois plus loin, a travers un anneau
    B = { ...Bn, a: a - 1.6 * V * T / R }; f = hopSeg(t0, T, A, B, 0.35);
  } else if (type === 'bumper') {                    // ejectee sur le cote en arc puis revient
    const h = hopSeg(t0, T, A, B, hopNat(T));
    f = s_ => { const q = h(s_), u = s_ / T, ang = Math.atan2(q.p.y, q.p.x), dr = (0.6 + 0.8 * K) * Math.sin(Math.PI * u);
      return { p: q.p.clone().add(V3(Math.cos(ang) * dr, Math.sin(ang) * dr, 0)) }; };
  } else if (type === 'verre') {                     // casse la vitre et tombe sur un bloc plus bas
    B = { ...Bn, a: a - 0.7 * V * T / R, z: Bn.z - 0.8 - 1.2 * K }; f = fallSeg(T, A, B, -0.5);
  } else if (type === 'portail') {                   // plonge dans le portail orange, ressort aussitot du bleu
    const E = { a: B.a, r: R, z: B.z + 0.8 + 0.8 * K }, tk = Math.min(0.08, T * 0.3);
    const fl = fallSeg(T - tk, { a: E.a, r: R, z: E.z - 0.3 }, B, -0.5);
    f = s_ => s_ < tk ? { p: P(a, r, z - 0.3 * s_ / tk) } : fl(s_ - tk);
    blk.tk = t0 + tk; blk.exit = E;
  } else if (type === 'aimant') {                    // aspiree vers l'aimant puis lachee
    const top = z + 0.9 + 0.8 * K, tu = 0.45 * T; tm = t0 + tu;
    const fl = fallSeg(T - tu, { a, r, z: top - BR * 2 }, B, 0);
    f = s_ => s_ < tu ? { p: P(a, r, z + (top - BR * 2 - z) * Math.pow(s_ / tu, 2.2)) } : fl(s_ - tu); blk.top = top;
  } else if (type === 'ventilo') {                   // flotte sur le souffle puis retombe
    const ap = z + 1.0 + 1.0 * K, tu = 0.55 * T; tm = t0 + tu;
    const fl = fallSeg(T - tu, { a: a - 0.3 * V * tu / R, r: R, z: ap }, B, 0);
    f = s_ => s_ < tu ? { p: P(a - 0.3 * V * s_ / R, R, z + (ap - z) * Math.sin(s_ / tu * Math.PI / 2)) } : fl(s_ - tu);
  } else {                                           // canon : la bille est tiree en ligne droite
    B = { ...Bn, a: a - 1.3 * V * T / R, z: Bn.z + 0.2 }; f = hopSeg(t0, T, A, B, 0.6 + 0.6 * K);
  }
  blk.tm = tm;
  BLOCKS.push(blk);
  EVENTS.push({ type, t: t0, tm, T1: T, T2: 0 });
  SEGS.push({ t0, t1: t0 + T, f });
  ga = B.a; gr = B.r; gz = B.z; i += 1;
}

function funnelState(fn, t) {
  const u = clamp((t - fn.rim) / fn.F, 0, 1) * (fn.arr.length - 1);
  const q = Math.min(Math.floor(u), fn.arr.length - 2), f = u - q;
  return [fn.arr[q][0] * (1 - f) + fn.arr[q + 1][0] * f, fn.arr[q][1] * (1 - f) + fn.arr[q + 1][1] * f];
}
function funnelPos(fn, t) {
  if (t < fn.drop) {
    const [th, rr] = funnelState(fn, t);
    return fn.C.clone().add(V3(rr * Math.cos(th), rr * Math.sin(th), fn.top - fn.k * (RF / rr - 1) + BR * 1.15));
  }
  const s = t - fn.drop, u = s / fn.D;
  const th = fn.arr[fn.arr.length - 1][0] + fn.w_end * s * (1 - 0.5 * Math.min(u, 1));
  const rr = R0 * Math.max(0, 1 - u / 0.3);
  return fn.C.clone().add(V3(rr * Math.cos(th), rr * Math.sin(th), fn.z_hole - fn.v0 * s - fn.A * s * s / 2));
}
function ballState(t) {
  if (t < HITS[0].t) { const d = HITS[0].t - t; return { p: P(0, R, 9 * d * d + 2.4 * d) }; }
  for (const sg of SEGS) if (t < sg.t1 || sg === SEGS[SEGS.length - 1]) return sg.f(t - sg.t0);
}
const ballPos = t => ballState(t).p;
function smoothBall(t, win = 0.45, n = 13) {
  const v = V3(0, 0, 0);
  for (let k = 0; k < n; k++) v.add(ballPos(t + (k / (n - 1) - 0.5) * 2 * win));
  return v.divideScalar(n);
}
const secAt = t => FUN.filter(fn => t >= fn.exit).length;

// ================= rendu =================
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(2 * Math.atan(18 / 36) * 180 / Math.PI, W / H, 0.1, 400);
camera.up.set(0, 0, 1);

// ciel crepusculaire (degrade selon la hauteur de la direction de vue)
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 vd;
    vec3 ramp(float x){
      vec3 c0=vec3(.035,.03,.09), c1=vec3(.95,.38,.22), c2=vec3(.38,.16,.34), c3=vec3(.10,.07,.22);
      if(x<.25) return c0; if(x<.5) return mix(c0,c1,(x-.25)/.25); if(x<.62) return mix(c1,c2,(x-.5)/.12);
      if(x<.92) return mix(c2,c3,(x-.62)/.30); return c3; }
    void main(){ float x = vd.z*.5+.5; gl_FragColor = vec4(ramp(x)*.85, 1.); }`
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0x8a7aff, 0x2a1020, 0.55));
const sun = new THREE.DirectionalLight(0xffb88c, 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const sc_ = sun.shadow.camera; sc_.left = -9; sc_.right = 9; sc_.top = 9; sc_.bottom = -9; sc_.near = 1; sc_.far = 60;
sun.shadow.bias = -0.0008; scene.add(sun); scene.add(sun.target);
const SUN_DIR = V3(Math.cos(0.61) * Math.sin(0.96), Math.sin(0.61) * Math.sin(0.96), Math.cos(0.96)).normalize();

const std = (c, ro = 0.4, me = 0, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: ro, metalness: me, ...extra });
const M_BODY = std(0x0c0c0e, 0.28, 0.2), M_STEEL = std(0xd0d0d8, 0.25, 1), M_DARK = std(0x1a1a20, 0.5, 0.3);
const box = (w, d, h, m) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, d, h), m); o.castShadow = o.receiveShadow = true; return o; };
const glowMat = c => new THREE.MeshBasicMaterial({ color: new THREE.Color(c), toneMapped: false });

// chiffres lumineux (7 segments) sur la face exterieure des blocs
const SEG7 = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcfgd' };
function digit(grp, d, x, w, h, mat) {
  const t = 0.065, m = { a: [0, h / 2 - t / 2, w - 2 * t, t], d: [0, -h / 2 + t / 2, w - 2 * t, t], g: [0, 0, w - 2 * t, t],
    f: [-w / 2 + t / 2, h / 4, t, h / 2 - t * 1.4], b: [w / 2 - t / 2, h / 4, t, h / 2 - t * 1.4],
    e: [-w / 2 + t / 2, -h / 4, t, h / 2 - t * 1.4], c: [w / 2 - t / 2, -h / 4, t, h / 2 - t * 1.4] };
  for (const k of SEG7[d]) { const [cy, cz, sw, sh] = m[k]; const o = new THREE.Mesh(new THREE.BoxGeometry(0.02, sw, sh), mat); o.position.set(x, cy, cz); grp.add(o); }
}
function frame(grp, x, w, h, mat) {
  for (const [cy, cz, sw, sh] of [[0, h / 2 - .035, w * .92, .035], [0, -h / 2 + .035, w * .92, .035], [w * .46 - .0175, 0, .035, h * .92], [-w * .46 + .0175, 0, .035, h * .92]]) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(0.02, sw, sh), mat); o.position.set(x, cy, cz); grp.add(o);
  }
}

const BOOMS = FUN.map(fn => fn.exit).concat([HITS[HITS.length - 1].t]);
const AMP = [0.45, 0.55, 0.65];
const anims = [];          // fonctions (t) => void appelees a chaque image
const BL = 2.5, BH = 0.85;

// bloc de base (corps sombre + chiffre + cadre neon) oriente radialement en (a, z)
function baseBlock(b, opt = {}) {
  const root = new THREE.Group(); scene.add(root);
  const piv = new THREE.Group(); root.add(piv);
  const bl = opt.bl || BL, w = opt.w || 0.9, bh = opt.bh || BH;
  const rr = opt.rr != null ? opt.rr : b.r + 0.35;
  root.position.copy(P(opt.ac != null ? opt.ac : b.a, rr, (opt.ztop != null ? opt.ztop : b.z - BR) - bh / 2));
  root.rotation.z = (opt.ac != null ? opt.ac : b.a) + (opt.rot || 0);
  if (!opt.noBody) piv.add(box(bl, w, bh, opt.mat || M_BODY));
  const col = opt.neon != null ? opt.neon : NEON[b.sec];
  const lit = glowMat(col);
  if (!opt.noDigit) { digit(piv, (b.i + 1) % 10, bl / 2 + 0.012, Math.min(w, 0.9) * 0.42, bh * 0.62, lit); frame(piv, bl / 2 + 0.012, w, bh, lit); }
  const th = b.t, booms = BOOMS.filter(x => x > th + 0.01);
  const base = new THREE.Color(col);
  const imps = b.hits.map((x, q) => [x, q === 0 ? (b.type === 'sortie' ? 1.0 : AMP[b.sec]) : 0.5 * AMP[b.sec]]);
  for (const hh of HITS) if (hh.sec === b.sec && th < hh.t && hh.t <= th + 1.6) imps.push([hh.t, 0.16 * AMP[b.sec]]);
  for (const x of booms) imps.push([x, 0.35]);
  const bz = root.position.z;
  anims.push(t => {
    let v = 0.0;
    if (t >= th) { v = 0.3 + 5.0 * Math.exp(-(t - th) / 0.35); for (const x of b.hits) if (t >= x && x > th) v += 3.5 * Math.exp(-(t - x) / 0.3); for (const x of booms) if (t >= x) v += 4.0 * Math.exp(-(t - x) / 0.45); }
    else v = 0.12;
    lit.color.copy(base).multiplyScalar(v);
    let dz = 0;
    for (const [ti, am] of imps) { const s = t - ti; if (s > 0) dz -= am * Math.exp(-3.2 * s) * Math.sin(2 * Math.PI * 2.4 * s); }
    root.position.z = bz + dz * (opt.dzScale || 1); piv.rotation.x = 0.35 * (dz * 0.9);
  });
  return { root, piv, lit, bl, w, bh };
}

// ---------- construction de chaque type ----------
const R_ = rnd(11);
for (const b of BLOCKS) {
  const T = b.type;
  if (T === 'normal' || T === 'sortie') {
    const o = baseBlock(b, T === 'sortie' ? { w: 1.4, bl: 2.6, rr: b.r } : {});
    if (T === 'sortie') for (const sy of [-1, 1]) { const l = new THREE.Mesh(new THREE.BoxGeometry(o.bl * .96, .04, .03), o.lit); l.position.set(0, sy * (o.w / 2 - .05), o.bh / 2 + .005); o.piv.add(l); }
    continue;
  }
  if (T === 'ressort') {           // socle + ressort + plateau vert qui s'ecrase puis se detend
    const o = baseBlock(b, { bh: 0.45, neon: 0x39ff6a, rr: b.r + 0.85, ztop: b.z - BR - 0.12 - 0.35 });
    const pad = box(1.1, 0.8, 0.12, std(0x1aff66, 0.35, 0.1, { emissive: 0x0a5a22 }));
    const coil = new THREE.Mesh(new THREE.TorusKnotGeometry(0.22, 0.03, 120, 8, 1, 9), M_STEEL);
    o.piv.add(pad, coil);
    const hz = 0.45 / 2;            // dessus du socle (repere local)
    anims.push(t => {
      const s = t - b.t; let c = 0;
      if (s > 0) c = -0.22 * Math.exp(-s / 0.06) * Math.cos(s * 22);
      const L = 0.35 + c;
      coil.position.set(-0.85, 0, hz + L / 2); coil.scale.set(1, 1, L / 0.55);
      pad.position.set(-0.85, 0, hz + L + 0.06);
    });
    continue;
  }
  if (T === 'slime') {             // bloc avec une flaque de slime vert qui tremble + fil collant
    const o = baseBlock(b, { neon: 0x7dff2a });
    const gm = new THREE.MeshPhysicalMaterial({ color: 0x55ff22, roughness: 0.15, transmission: 0.0, transparent: true, opacity: 0.85, emissive: 0x1c6a06, clearcoat: 1 });
    const blob = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 16), gm);
    blob.position.set(-0.35, 0, BH / 2); o.piv.add(blob);
    const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 1, 10), gm); fil.rotation.x = Math.PI / 2; scene.add(fil);
    const anchor = P(b.a, b.r, b.z - BR);
    anims.push(t => {
      const s = t - b.t; const wob = s > 0 ? 0.25 * Math.exp(-s / 0.3) * Math.sin(s * 26) : 0;
      blob.scale.set(1 + wob, 1 + wob, 0.22 - wob * 0.4);
      const u = t - b.tm;
      if (u > -0.02 && u < 0.22) {
        const bp = ballPos(t), d = bp.clone().sub(anchor), L = d.length();
        fil.visible = true; fil.position.copy(anchor).addScaledVector(d, 0.5);

}

// ---------- bille ----------
const ballM = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.1, emissive: 0xffffff, emissiveIntensity: 1.6 });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BR, 64, 32), ballM); ball.castShadow = true;
const ballG = new THREE.Group(); ballG.add(ball); scene.add(ballG);
const blight = new THREE.PointLight(0xffffff, 6, 7, 1.6); ballG.add(blight);
const halo = new THREE.Mesh(new THREE.SphereGeometry(BR * 1.9, 32, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
ballG.add(halo);
const dotTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 128; const cx = cv.getContext('2d');
  const g = cx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); cx.fillStyle = g; cx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv); })();
const marker = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, depthTest: false, depthWrite: false, transparent: true, blending: THREE.AdditiveBlending, toneMapped: false }));
marker.renderOrder = 999; marker.scale.setScalar(BR * 4.2); ballG.add(marker);
function ballCol(t) {
  let c = BALLC[0].slice();
  FUN.forEach((fn, q) => { const u = sstep(fn.drop, fn.exit, t); c = c.map((v, j) => v * (1 - u) + BALLC[q + 1][j] * u); });
  return c;
}

// ---------- camera ----------
function rig(t) {
  const e = secAt(t), sb = smoothBall(t, 0.2, 9), lk = smoothBall(t + 0.08, 0.15, 7);
  const a_ = Math.atan2(sb.y, sb.x);
  const phi = a_ + 0.62 + 0.12 * Math.sin(t * 0.35) + 0.18 * e * Math.sin(t * 0.9);
  const rc = 12.0 - 1.3 * e + 0.6 * Math.sin(t * 0.42), hc = 5.6 - 0.5 * e + 0.6 * Math.sin(t * 0.31 + 1.2);
  let pos = V3(rc * Math.cos(phi), rc * Math.sin(phi), sb.z + hc);
  let tg = V3(lk.x, lk.y, lk.z - 0.5);
  for (const fn of FUN) {
    const wf = sstep(fn.rim - 0.45, fn.rim + 0.2, t) * (1 - sstep(fn.drop - 0.12, fn.drop + 0.12, t));
    const wd = sstep(fn.drop - 0.12, fn.drop + 0.12, t) * (1 - sstep(fn.exit + 0.1, fn.exit + 0.7, t));
    if (wf > 0) { const u = (t - fn.rim) / fn.F, psi = fn.ac + 0.35 + 0.6 * u;
      pos.lerp(V3(fn.C.x + 3.3 * Math.cos(psi), fn.C.y + 3.3 * Math.sin(psi), fn.top + 6.3 - 1.2 * u), wf); tg.lerp(V3(fn.C.x, fn.C.y, fn.top - 0.9), wf); }
    if (wd > 0) { const bp = ballPos(Math.min(t, fn.exit)), psi = fn.ac + 0.75;
      pos.lerp(V3(fn.C.x + 5.2 * Math.cos(psi), fn.C.y + 5.2 * Math.sin(psi), bp.z + 1.0), wd); tg.lerp(V3(fn.C.x, fn.C.y, bp.z - 0.6), wd); }
  }
  const tf = HITS[HITS.length - 1].t, wz = sstep(tf - 0.1, tf + 1.3, t);
  if (wz > 0) { const bp = ballPos(t), ab = Math.atan2(bp.y, bp.x) + 0.95;
    pos.lerp(V3(13 * Math.cos(ab), 13 * Math.sin(ab), bp.z + 4.5), wz); tg.lerp(V3(bp.x * 0.7, bp.y * 0.7, bp.z - 1.5), wz); }
  for (const tb of BOOMS) { const s = t - tb; if (s > 0 && s < 0.8) { const k = 0.22 * Math.exp(-6 * s); pos.add(V3(Math.sin(53 * s), Math.cos(47 * s), Math.sin(61 * s)).multiplyScalar(k)); } }
  return [pos, tg];
}

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.5, 0.8));
composer.addPass(new OutputPass());

function renderAt(t) {
  for (const f of anims) f(t);
  const st = ballState(t);
  ballG.position.copy(st.p);
  const sc = st.sc != null ? st.sc : 1, sq = st.sq || 0;
  ballG.scale.set(sc * (1 + 0.6 * sq), sc * (1 + 0.6 * sq), sc * (1 - sq));
  ballG.position.z -= BR * sq * sc;
  ballG.visible = sc > 0.01;
  ball.rotation.set(t * 2.1, -t * 3.3, 0);
  const c = ballCol(t); ballM.color.setRGB(...c); ballM.emissive.setRGB(...c); blight.color.setRGB(...c);
  const boost = FUN.reduce((acc, fn) => acc + sstep(fn.rim, fn.drop, t) * (1 - sstep(fn.exit, fn.exit + 0.6, t)), 0);
  blight.intensity = 6 + 8 * boost; halo.material.color.setRGB(...c); marker.material.color.setRGB(0.55 + 0.45 * c[0], 0.55 + 0.45 * c[1], 0.55 + 0.45 * c[2]);
  let ps = V3(0, 0, 0), ts = V3(0, 0, 0);
  for (let q = 0; q < 5; q++) { const [p_, t_] = rig(t + (q / 4 - 0.5) * 0.08); ps.add(p_); ts.add(t_); }
  camera.position.copy(ps.divideScalar(5)); camera.lookAt(ts.divideScalar(5));
  sky.position.copy(camera.position);
  sun.position.copy(st.p).addScaledVector(SUN_DIR, 25); sun.target.position.copy(st.p);
  composer.render();
}
window.renderAt = t => { renderAt(t); return renderer.domElement.toDataURL('image/jpeg', 0.93); };
window.ballNDC = t => { renderAt(t); const bp = ballPos(t); window.__dbg = [bp.toArray().map(x=>+x.toFixed(2)), camera.position.toArray().map(x=>+x.toFixed(2))]; const v = bp.clone().project(camera); return [v.x, v.y, v.z]; };
window.END = END; window.EVENTS = EVENTS; window.READY = true;
if (!params.has('capture')) { const st = performance.now(); (function loop(){ renderAt(((performance.now()-st)/1000) % END); requestAnimationFrame(loop); })(); }
</script></body></html>
